# Butterfly 主题配置（覆盖主题默认值）
# 完整配置项参考: node_modules/hexo-theme-butterfly/_config.yml

# 头像
avatar:
  img: /img/avatar.jpg
  effect: false

# 网站背景（整页背景图）
background: /img/background.jpg

# 首页顶部大图（banner）
index_img: /img/background.jpg

# 其他页面默认 banner（归档、分类、标签等没有单独设置时的兜底图）
default_top_img: /img/background.jpg

# 导航菜单（显示名: 路径 || 图标）
menu:
  Home: / || fas fa-home
  Archives: /archives/ || fas fa-archive
  List||fas fa-list:
    Music: /music/ || fas fa-music
    Tags: /tags/ || fas fa-tags

# 站内搜索
search:
  use: local_search
  placeholder: Search

# 访问统计（不蒜子）
busuanzi:
  site_uv: true    # 站点总访问人数
  site_pv: true    # 站点总访问量
  page_pv: true    # 单页访问量

# 夜间模式切换
darkmode:
  enable: true
  button: true        # 右上角显示 太阳/月亮 切换按钮
  autoChangeMode: 2   # 2=18:00-06:00 自动切夜间，1=跟随系统，false=手动

# 社交链接（图标: 链接 || 文字说明 || 颜色）
social:
  fab fa-github: https://github.com/PanPup1002 || GitHub || '#24292e'
  fas fa-envelope: mailto:lfan54182@gmail.com || Email || '#4a7dbe'

# 侧边栏
aside:
  card_author:
    # 作者卡片里的简介文字
    description: Slacking at work, please don't disturb
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/PanPup1002
  card_announcement:
    enable: true
    content: Welcome to my blog, feel free to look around~

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
  custom_text: Slacking at work, double the fun
